services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 17 (Metastore, Airflow, and Superset Databases)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_USER:-postgres}
    volumes:
      - ./infra/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 2. MinIO S3 Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "mkdir -p /data/$${S3_BUCKET:-lakehouse} &&
       exec /usr/bin/minio server /data --console-address :9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-lakehouse}
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # 3. MongoDB 8.0 (Replica Set rs0 - Self-Bootstrapping)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:8.0
    container_name: mongodb
    restart: unless-stopped
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongodb/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/mongodb/init-schema.js:/docker-entrypoint-initdb.d/init-schema.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # 4. Apache Kafka (KRaft Mode)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 5. Kafka Connect + MongoDB Sink Connector (Self-Bootstrapping)
  # ---------------------------------------------------------------------------
  kafka-connect:
    image: apache/kafka:4.3.1
    container_name: kafka-connect
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    volumes:
      - ./infra/kafka-connect/plugins:/opt/kafka/plugins:ro
      - ./infra/kafka-connect/connect-distributed.properties:/opt/kafka/config/connect-distributed.properties:ro
      - ./infra/kafka-connect/mongo-sink.json:/opt/kafka/config/mongo-sink.json:ro
      - ./infra/kafka-connect/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      - kafka
      - mongodb
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 6. Hive Metastore 3.1.3
  # ---------------------------------------------------------------------------
  hive-metastore:
    image: apache/hive:3.1.3
    platform: linux/amd64
    container_name: hive-metastore
    restart: unless-stopped
    ports:
      - "9083:9083"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./infra/hive-metastore/metastore-site.xml:/opt/hive/conf/metastore-site.xml:ro
      - ./infra/hive-metastore/metastore-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./infra/hive-metastore/entrypoint.sh:/entrypoint.sh:ro
      - ./infra/hive-metastore/lib/postgresql-42.7.2.jar:/opt/hive/lib/postgresql-42.7.2.jar:ro
      - ./infra/hive-metastore/lib/hadoop-aws-3.1.0.jar:/opt/hive/lib/hadoop-aws-3.1.0.jar:ro
      - ./infra/hive-metastore/lib/aws-java-sdk-bundle-1.11.271.jar:/opt/hive/lib/aws-java-sdk-bundle-1.11.271.jar:ro
    entrypoint: ["/entrypoint.sh"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1024M

  # ---------------------------------------------------------------------------
  # 7. Apache Spark 3.5.9 (Consolidated Master + Worker)
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.9
    container_name: spark-master
    restart: unless-stopped
    user: root
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "7077:7077"
      - "8082:8082"
      - "8084:8084"
    environment:
      SPARK_MASTER_HOST: ${SPARK_MASTER_HOST:-spark-master}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-4}
    volumes:
      - spark_home:/opt/spark
      - lakehouse_staging:/tmp/lakehouse
      - ./jobs:/opt/spark/jobs:ro
      - ./ingestion:/opt/spark/ingestion:ro
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./infra/spark/jars:/opt/spark-extra-jars
      - ./infra/spark/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - hive-metastore
      - minio
    deploy:
      resources:
        limits:
          memory: 4096M

  # ---------------------------------------------------------------------------
  # 8. PrestoDB 0.299 (1 Coordinator + 2 Dedicated Workers)
  # ---------------------------------------------------------------------------
  presto-coordinator:
    image: prestodb/presto:0.299
    container_name: presto-coordinator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./infra/presto/coordinator/config.properties:/opt/presto-server/etc/config.properties:ro
      - ./infra/presto/coordinator/jvm.config:/opt/presto-server/etc/jvm.config:ro
      - ./infra/presto/coordinator/node.properties:/opt/presto-server/etc/node.properties:ro
      - ./infra/presto/catalog:/opt/presto-server/etc/catalog:ro
    depends_on:
      - hive-metastore
      - mongodb
      - minio
    deploy:
      resources:
        limits:
          memory: 1434M

  presto-worker-1:
    image: prestodb/presto:0.299
    container_name: presto-worker-1
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./infra/presto/worker-1/config.properties:/opt/presto-server/etc/config.properties:ro
      - ./infra/presto/jvm.config:/opt/presto-server/etc/jvm.config:ro
      - ./infra/presto/worker-1/node.properties:/opt/presto-server/etc/node.properties:ro
      - ./infra/presto/catalog:/opt/presto-server/etc/catalog:ro
    depends_on:
      - presto-coordinator
      - hive-metastore
      - mongodb
      - minio
    deploy:
      resources:
        limits:
          memory: 1843M

  presto-worker-2:
    image: prestodb/presto:0.299
    container_name: presto-worker-2
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./infra/presto/worker-2/config.properties:/opt/presto-server/etc/config.properties:ro
      - ./infra/presto/jvm.config:/opt/presto-server/etc/jvm.config:ro
      - ./infra/presto/worker-2/node.properties:/opt/presto-server/etc/node.properties:ro
      - ./infra/presto/catalog:/opt/presto-server/etc/catalog:ro
    depends_on:
      - presto-coordinator
      - hive-metastore
      - mongodb
      - minio
    deploy:
      resources:
        limits:
          memory: 1843M

  # ---------------------------------------------------------------------------
  # 9. Apache Airflow 3.3.2 (Orchestration)
  # ---------------------------------------------------------------------------
  airflow:
    image: apache/airflow:3.3.2
    container_name: airflow
    restart: unless-stopped
    user: root
    entrypoint: ["/entrypoint.sh"]
    command: standalone
    ports:
      - "8081:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_manager_passwords.json
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${AIRFLOW_DB:-airflow}
      AIRFLOW_CONN_SPARK_DEFAULT: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_MASTER: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/?replicaSet=rs0}
      MONGO_DATABASE: ${MONGO_DATABASE:-market_data}
      PRESTO_COORDINATOR_URL: ${PRESTO_COORDINATOR_URL:-http://presto-coordinator:8080/v1/statement}
      BACKFILL_DAYS: ${BACKFILL_DAYS:-2}
      SLICES_PER_DAY: ${SLICES_PER_DAY:-96}
      SPARK_HOME: /opt/spark
      JAVA_HOME: /usr/lib/jvm/default-java
      PATH: /opt/spark/bin:/usr/lib/jvm/default-java/bin:/home/airflow/.local/bin:/usr/python/bin:/usr/local/bin:/usr/bin:/bin
      PYTHONPATH: /home/airflow/.local/lib/python3.13/site-packages
      VIRTUAL_ENV: /home/airflow/.local
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      _PIP_ADDITIONAL_REQUIREMENTS: "pymongo requests pyarrow pandas"
    volumes:
      - ./pipelines/dags:/opt/airflow/dags
      - ./jobs:/opt/airflow/jobs
      - ./ingestion:/opt/airflow/ingestion
      - spark_home:/opt/spark:ro
      - lakehouse_staging:/tmp/lakehouse
      - ./infra/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./infra/spark/jars:/opt/spark-extra-jars:ro
      - ./infra/airflow/entrypoint.sh:/entrypoint.sh:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      spark-master:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 3072M

  # ---------------------------------------------------------------------------
  # 10. Apache Superset 6.1.0 (BI Dashboards)
  # ---------------------------------------------------------------------------
  superset:
    image: apache/superset:6.1.0
    container_name: superset
    restart: unless-stopped
    user: root
    entrypoint: ["/app/init-superset.sh"]
    ports:
      - "8088:8088"
    environment:
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-gdelt_lakehouse_workshop_secret_key_2026_xyz!}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SUPERSET_DB: ${SUPERSET_DB:-superset}
      PYTHONPATH: "/app/pythonpath"
    volumes:
      - ./infra/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ./infra/superset/init-superset.sh:/app/init-superset.sh:ro
      - ./infra/superset/provision_dashboard.py:/app/provision_dashboard.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      presto-coordinator:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1536M

  # ---------------------------------------------------------------------------
  # 11. Stream Producer (GDELT 2.0 Live Broadcast -> Kafka)
  # ---------------------------------------------------------------------------
  stream-producer:
    image: python:3.12-slim
    container_name: stream-producer
    restart: unless-stopped
    depends_on:
      - kafka
    volumes:
      - ./ingestion/stream_producer:/app:ro
      - lakehouse_staging:/tmp/lakehouse
    environment:
      KAFKA_BROKER: kafka:9092
      GDELT_POLL_INTERVAL_SEC: ${GDELT_POLL_INTERVAL_SEC:-60}
      PRODUCER_STATE_FILE: /tmp/lakehouse/state/last_processed_file.txt
    command: >
      sh -c "pip install --no-cache-dir confluent-kafka requests certifi &&
             python /app/producer.py"
    deploy:
      resources:
        limits:
          memory: 256M
volumes:
  postgres_data:
  minio_data:
  mongodb_data:
  kafka_data:
  spark_home:
  airflow_logs:
  lakehouse_staging:
