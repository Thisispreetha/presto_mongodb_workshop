spark.sql.extensions                         org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.iceberg                    org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.iceberg.type               hive
spark.sql.catalog.iceberg.uri                thrift://hive-metastore:9083
spark.sql.catalog.iceberg.warehouse          s3a://lakehouse/warehouse
spark.sql.catalog.iceberg.io-impl            org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.iceberg.s3.endpoint        http://minio:9000
spark.sql.catalog.iceberg.s3.path-style-access true
spark.sql.catalog.iceberg.client.region      us-east-1
spark.sql.session.timeZone                   UTC
spark.sql.sources.partitionOverwriteMode     dynamic
spark.driver.extraClassPath                  /opt/spark-extra-jars/*
spark.executor.extraClassPath                /opt/spark-extra-jars/*
spark.driver.extraJavaOptions                -Dio.netty.tryReflectionSetAccessible=true -Dorg.apache.iceberg.shaded.io.netty.tryReflectionSetAccessible=true -XX:-TieredCompilation
spark.executor.extraJavaOptions              -Dio.netty.tryReflectionSetAccessible=true -Dorg.apache.iceberg.shaded.io.netty.tryReflectionSetAccessible=true -XX:-TieredCompilation
spark.sql.iceberg.vectorization.enabled      false
spark.sql.shuffle.partitions                 4
spark.default.parallelism                    4


# Hadoop S3A configurations for raw landing reads
spark.hadoop.fs.s3a.endpoint                 http://minio:9000
spark.hadoop.fs.s3a.aws.credentials.provider com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.path.style.access        true
spark.hadoop.fs.s3a.connection.ssl.enabled   false
spark.hadoop.fs.s3a.impl                     org.apache.hadoop.fs.s3a.S3AFileSystem
